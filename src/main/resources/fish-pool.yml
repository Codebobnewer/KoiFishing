# Koi fish pool - empty by default. Each id here must have a matching Vulcan item authored with
# /v item create <id> before it's actually catchable - Vulcan owns the item's appearance AND its
# rarity (set rarity there with /v item edit <id> - Koi maps it 1:1 by name: COMMON, UNCOMMON,
# RARE, EPIC, LEGENDARY, MYTHIC). This file only owns drop-weight/category/sound/biomes, i.e. the
# data that drives the catch roll and reel-in minigame. category is FISH, TREASURE, or JUNK - all
# three share the same pool/roll/reel-in minigame. catch-sound is optional per entry; species
# without one fall back to fishing.default-catch-sound in config.yml. vanilla-loot: true entries
# are only rolled while fishing.vanilla-loot-enabled is on in config.yml.
#
# favored-biomes is a soft boost (1.5x catch weight in those biomes, still catchable elsewhere).
# whitelisted-biomes is a hard allow-list - if set, this species can ONLY be caught in these
# biomes and is excluded everywhere else. Both accept any biome key: vanilla ones like
# minecraft:river, minecraft:ocean, or a BiomeMaker custom biome like jeracraft:mist_garden -
# BiomeMaker registers its biomes into the server's real biome registry, so they read back
# through the same vanilla Biome API Koi already uses, no special handling needed.
#
# Example (assumes /v item create my_golden_koi already ran, with its rarity set to LEGENDARY):
#
# species:
#   my_golden_koi:
#     drop-weight: 1.0
#     category: FISH
#     catch-sound: UI_TOAST_CHALLENGE_COMPLETE
#     whitelisted-biomes:
#       - jeracraft:mist_garden

species: {}
