# Koi fish pool - seed data. Custom model data values are placeholders pending a resource pack.
# Editable in-game via /koi setspawn. category is FISH, TREASURE, or JUNK - all three share the
# same pool/roll/reel-in minigame. catch-sound is optional per entry; species without one fall
# back to fishing.default-catch-sound in config.yml. vanilla-loot: true entries (vanilla items
# dropped as-is) are only rolled while fishing.vanilla-loot-enabled is on in config.yml.

